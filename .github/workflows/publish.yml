name: Publish site and refresh podcast
on:
  push:
    branches: [master]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh podcast from RSS
        id: rss
        continue-on-error: true
        run: python .github/scripts/sync_podcast.py
      - name: Keep the last published site if a scheduled refresh fails
        if: steps.rss.outcome == 'failure' && github.event_name == 'schedule'
        run: exit 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
        id: deployment
