name: Publish site and refresh podcast
on:
  push:
    branches: [master]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test podcast feed handling
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Refresh podcast from RSS
        id: rss
        continue-on-error: true
        run: python .github/scripts/sync_podcast.py
      - name: Report unavailable podcast feeds
        if: steps.rss.outcome == 'failure'
        run: |
          echo "::warning::The official podcast feeds are unavailable. The existing podcast page was preserved."
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Podcast refresh skipped: feeds unavailable. The live deployment was left unchanged." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Podcast refresh unavailable. Publishing site updates with the committed podcast fallback." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/configure-pages@v5
        if: github.event_name != 'schedule' || steps.rss.outcome == 'success'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule' || steps.rss.outcome == 'success'
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
        if: github.event_name != 'schedule' || steps.rss.outcome == 'success'
        id: deployment
